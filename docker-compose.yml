services:
  app:
    image: ${OHOS_TEST_SERVER_IMAGE:-ohos-test-server:latest}
    container_name: ohos-test-server
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file:
      - ./server/.env.local
    environment:
      AUTH_COOKIE_SECURE: "false"
    ports:
      - "80:3000"
    volumes:
      - ./data:/app/data
